<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Clean - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#086e96',
                        brandLight: '#73a5bd',
                        brandBg: '#eef6fc',
                        orangeBtn: '#fa7354',
                        orangeHover: '#e36243'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-brandBg min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-gray-100">

        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center justify-center gap-2 mb-6">
                <img src="loundery logo.png" alt="Elite Clean Logo"
                    class="h-10 w-10 rounded bg-white p-1 shadow-sm border border-gray-100">

                <div class="text-left">
                    <h1 class="font-bold text-lg leading-none text-brand">ELITE</h1>
                    <p class="font-medium text-xs leading-none text-brand">CLEAN</p>
                </div>
            </a>

            <h2 class="text-2xl font-bold text-brand">Welcome Back</h2>
            <p class="text-brandLight text-sm mt-2">
                Enter your credentials to access your account
            </p>
        </div>

        <form id="login-form" class="space-y-5">

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">
                    Email
                </label>

                <div class="relative">
                    <i class="ri-mail-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                    <input type="email" id="email" required
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand text-sm transition-all"
                        placeholder="Email">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">
                    Password
                </label>

                <div class="relative">
                    <i class="ri-lock-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                    <input type="password" id="password" required
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand text-sm transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div id="error-msg"
                class="text-red-500 text-sm hidden text-center bg-red-50 py-2 rounded-lg border border-red-100"></div>

            <div id="success-msg"
                class="text-green-600 text-sm hidden text-center bg-green-50 py-2 rounded-lg border border-green-100">
            </div>

            <button type="submit"
                class="w-full bg-orangeBtn hover:bg-orangeHover text-white py-4 rounded-xl font-bold transition-all shadow-md shadow-orangeBtn/20 mt-2 hover:scale-[1.02]">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-8">
            Don't have an account?
            <a href="signup.html" class="text-brand font-semibold hover:underline">
                Sign up
            </a>
        </p>
    </div>

    <script src="app.js"></script>
</body>

</html>
