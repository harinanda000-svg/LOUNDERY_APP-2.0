<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Clean - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#086e96',
                        brandLight: '#73a5bd',
                        brandBg: '#eef6fc',
                        orangeBtn: '#fa7354',
                        orangeHover: '#e36243',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
        
        /* Premium Minimal Hero Enhancements */
        .hero-img-container {
            position: relative;
            z-index: 10;
        }

        /* Soft Blue Radial Glow */
        .hero-glow-bg {
            position: absolute;
            inset: -40px;
            background: radial-gradient(circle at 50% 50%, rgba(8, 110, 150, 0.15), transparent 70%);
            filter: blur(40px);
            z-index: -2;
            animation: softPulse 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes softPulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Idle Animation */
        .hero-idle-anim {
            animation: gentleFloat 6s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.01); }
        }

        /* Thin Animated Gradient Border & Soft Shadow */
        .hero-img-wrapper {
            position: relative;
            border-radius: 1.5rem;
            padding: 2px; /* Thin border */
            background: linear-gradient(135deg, #086e96, #73a5bd, #fa7354, #086e96);
            background-size: 300% 300%;
            animation: spinGradient 10s linear infinite;
            box-shadow: 0 15px 35px -10px rgba(8, 110, 150, 0.15);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform, box-shadow;
            z-index: 1;
        }

        @keyframes spinGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hover Effect */
        @media (hover: hover) {
            .hero-img-container:hover .hero-img-wrapper {
                transform: scale(1.03) rotate(1deg) translateY(-6px);
                box-shadow: 0 25px 50px -12px rgba(8, 110, 150, 0.25), 0 0 15px rgba(250, 115, 84, 0.1);
            }
        }

        /* Inner Image Container */
        .hero-img-inner {
            position: relative;
            border-radius: calc(1.5rem - 2px);
            overflow: hidden;
            background: white;
            z-index: 2;
        }

        /* Improved Crisp Image Rendering */
        .hero-img-inner img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            /* High resolution sharpening & color enhancement */
            image-rendering: high-quality;
            filter: brightness(1.02) contrast(1.06) saturate(1.08);
            transition: filter 0.6s ease;
            will-change: filter;
        }

        /* Subtle Shine Animation */
        .hero-shine {
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-20deg);
            z-index: 3;
            pointer-events: none;
        }
        .hero-img-container:hover .hero-shine {
            animation: shineSweep 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes shineSweep {
            100% { left: 200%; }
        }

        /* Tiny Sparkles */
        .hero-sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(255,255,255,0.8);
            opacity: 0;
            z-index: 5;
            pointer-events: none;
        }
        .hero-sparkle:nth-child(2) { top: 5%; left: 10%; animation: sparkleFade 4s ease-in-out infinite 0.5s; }
        .hero-sparkle:nth-child(3) { bottom: 10%; right: 5%; animation: sparkleFade 5s ease-in-out infinite 2s; }
        .hero-sparkle:nth-child(4) { top: 40%; right: -2%; animation: sparkleFade 6s ease-in-out infinite 3.5s; }
        
        @keyframes sparkleFade {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Floating Soap Bubbles */
        .particle-layer {
            position: absolute;
            inset: -20px;
            z-index: 15; /* Front/around image */
            pointer-events: none;
            overflow: visible;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            /* Minimal bubble styling */
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 0 4px rgba(255,255,255,0.1);
            opacity: 0;
            bottom: 0;
            will-change: transform, opacity;
            animation: bubbleFloat var(--duration) ease-in infinite;
        }
        @keyframes bubbleFloat {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            50% { transform: translate(var(--drift), -100px) scale(1); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translate(calc(var(--drift) * 1.5), -250px) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body class="bg-brandBg min-h-screen text-gray-800 flex flex-col">
    <script>
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'home.html';
        }
    </script>

    <!-- Header -->
    <header class="w-full py-6 px-6 sm:px-12 flex justify-between items-center z-50 max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <img src="loundery logo.png" alt="Laundry Logo" class="h-12 w-12 rounded-md bg-white p-1 shadow-sm">
            <div>
                <h1 class="font-bold text-xl leading-none text-brand">ELITE</h1>
                <p class="font-medium text-sm leading-none text-brand">CLEAN</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="login.html" class="text-brand font-semibold hover:text-orangeBtn transition">Login</a>
            <a href="signup.html" class="bg-brand text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-brand/90 transition shadow-md">Sign Up</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-6 sm:px-12 pb-12">
        <div class="max-w-7xl mx-auto w-full flex flex-col md:flex-row items-center gap-12 lg:gap-20">
            <!-- Text Content -->
            <div class="w-full md:w-1/2 flex flex-col justify-center text-center md:text-left">
                <p class="text-orangeBtn uppercase tracking-widest font-semibold text-sm mb-4">Your Premium Laundry Partner</p>
                <h2 class="text-5xl lg:text-6xl xl:text-7xl font-black text-brand leading-[1.05] mb-6 tracking-tight">
                    Fresh Clothes,<br>Zero Hassle.
                </h2>
                <p class="text-brandLight text-lg mb-10 max-w-lg mx-auto md:mx-0 leading-relaxed">
                    Compare and book nearby laundry partners through one platform. Pickup, cleaning, and delivery — all in one place.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start mb-12">
                    <a href="signup.html" class="bg-orangeBtn hover:bg-orangeHover text-white px-8 py-4 rounded-xl font-bold text-lg transition-all shadow-lg shadow-orangeBtn/30 hover:scale-[1.02] text-center">Get Started Now</a>
                    <a href="login.html" class="bg-white text-brand border border-brand/20 px-8 py-4 rounded-xl font-bold text-lg transition-all hover:bg-gray-50 shadow-sm text-center">Login to Account</a>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-2 lg:grid-cols-4 gap-4 text-left max-w-2xl mx-auto md:mx-0">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand"><i class="ri-truck-line text-lg"></i></div>
                        <span class="font-medium text-brand text-sm">Pickup</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand"><i class="ri-store-2-line text-lg"></i></div>
                        <span class="font-medium text-brand text-sm">Partners</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand"><i class="ri-time-line text-lg"></i></div>
                        <span class="font-medium text-brand text-sm">Fast Delivery</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-brand"><i class="ri-map-pin-time-line text-lg"></i></div>
                        <span class="font-medium text-brand text-sm">Live Tracking</span>
                    </div>
                </div>
            </div>

            <!-- Image Content -->
            <div class="w-full md:w-[45%] flex justify-center mt-12 md:mt-0 relative hero-img-container">
                <!-- Background radial glow -->
                <div class="hero-glow-bg w-full max-w-md mx-auto"></div>

                <!-- Idle Animation Wrapper -->
                <div class="hero-idle-anim relative w-full max-w-md">
                    <!-- Particle Layer for Bubbles -->
                    <div class="particle-layer" id="particles"></div>

                    <!-- Main Image Wrapper with Gradient Border -->
                    <div class="hero-img-wrapper">
                        <div class="hero-img-inner">
                            <img src="indin women washing.jpg" alt="Premium Laundry Service" class="w-full h-auto object-cover aspect-[4/5]">
                            <div class="hero-shine"></div>
                        </div>
                        <!-- Sparkles -->
                        <div class="hero-sparkle"></div>
                        <div class="hero-sparkle"></div>
                        <div class="hero-sparkle"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Premium Minimal JS for interactions -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const particleLayer = document.getElementById('particles');

            // Generate Minimal Floating Bubbles
            if (particleLayer) {
                // 6-10 bubbles as requested
                const bubbleCount = Math.floor(Math.random() * 5) + 6; 
                
                for (let i = 0; i < bubbleCount; i++) {
                    const bubble = document.createElement('div');
                    bubble.classList.add('bubble');
                    
                    // Sizes between 10px - 30px
                    const size = Math.random() * 20 + 10; 
                    // Durations between 6s - 12s
                    const duration = Math.random() * 6 + 6; 
                    // Opacity between 0.15 - 0.35
                    const maxOpacity = Math.random() * 0.2 + 0.15; 
                    
                    // Position around edges/corners (avoiding center)
                    let left;
                    if (Math.random() > 0.5) {
                        left = Math.random() * 25; // 0% to 25% (Left side)
                    } else {
                        left = Math.random() * 25 + 75; // 75% to 100% (Right side)
                    }
                    
                    // Drift amount (-20px to +20px)
                    const drift = (Math.random() * 40 - 20) + 'px';
                    const delay = Math.random() * 6; // Random start time
                    
                    bubble.style.width = `${size}px`;
                    bubble.style.height = `${size}px`;
                    bubble.style.left = `${left}%`;
                    bubble.style.setProperty('--duration', `${duration}s`);
                    bubble.style.setProperty('--max-opacity', maxOpacity);
                    bubble.style.setProperty('--drift', drift);
                    bubble.style.animationDelay = `${delay}s`;
                    
                    particleLayer.appendChild(bubble);
                }
            }
        });
    </script>
</body>
</html>
